name: Rebase Disney branch

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disney-rebase
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase onto upstream FrogPilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run on the FrogAi repo
        shell: bash
        run: |
          case "${GITHUB_REPOSITORY}" in
            FrogAi/*)
              echo "This job is for the private personal fork only."
              exit 1
              ;;
          esac

      - name: Checkout the Disney branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/disney-theme-f72d

      - name: Rebase onto upstream FrogPilot
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git remote get-url origin)" == *FrogAi/FrogPilot* ]]; then
            echo "Refusing to push to FrogAi/FrogPilot."
            exit 1
          fi

          git config user.name "disney-rebase"
          git config user.email "disney-rebase@users.noreply.github.com"
          git remote add upstream https://github.com/FrogAi/FrogPilot.git
          git fetch upstream FrogPilot

          previous="$(git rev-parse HEAD)"
          if ! git rebase upstream/FrogPilot; then
            echo "Rebase hit a conflict. The Disney branch was not pushed."
            git rebase --abort || true
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" == "$previous" ]]; then
            echo "Disney branch already contains upstream FrogPilot. Nothing to push."
            exit 0
          fi

          # Update only the Disney install branch, and only after a clean rebase.
          # FrogPilot, the default stock branch, is left alone.
          git push --force-with-lease=cursor/disney-theme-f72d:"$previous" \
            origin HEAD:cursor/disney-theme-f72d
